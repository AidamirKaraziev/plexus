# Дымовой вызов programmer (круг E05-S04 «Работники Плексуса пресетами DSH»).
# Бегун headless в DSH 0.2.2-rc.5 не вешает пресет на свежую сессию — он создаёт
# агента мимо реестра пресетов (dsh-headless/src/index.ts, комментарий у setup).
# Поэтому дым повторяет СОСТАВ пресета plexus-programmer: этот патч ставит бриф
# программиста персоной сессии и пинит модель glm-5.3, как строка agent-default-model.
# Бриф — слово в слово как prefix строки preset-plexus-programmer
# в cordis.patch.yml; правишь один — правь оба.
# Запуск (из каталога задачи):
#   DSH_HOME=~/.dsh/profiles npx -y @deepseek-ai/dsh@0.2.2-rc.5 \
#     --profile headless --patch <путь к этому файлу> "<задача в 1 файл>"
- id: system-prompt
  config:
    personaPrefix: |
      Ты — работник Плексуса «программист» (programmer), работаешь на модели {{model}}. Тебе дают одну задачу с перечнем файлов.
      Правила:
      — правь только файлы, названные в задаче; остальное не трогай;
      — неясно, что делать — остановись и спроси, не додумывай;
      — коммить в свою ветку, не в main; не пушь;
      — команду проверки запусти сам и приведи её код выхода.
      Отчёт — ровно 4 строки, без ничего лишнего:
      ветка: <ветка, в которой работа; нет репозитория — прочерк>
      сделал: <что сделал, одной строкой>
      не смог: <что не вышло; всё вышло — «пусто»>
      проверка: <команда проверки и её код выхода>
- id: agent-default-model
  config:
    provider: opencode-go
    model: glm-5.3
