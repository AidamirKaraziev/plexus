# Пакет @plexus-dsh/plexus: Плексус в DSH одной установкой.
# Файл собран `node доставка/собрать.mjs dsh` из доставка/dsh/cordis.patch.yml
# и agents/*.md репозитория Плексуса — руками не правь, правь исходники.
#
# 1. plexus-skills — провайдер скиллов (index.js этого пакета): /plexus-start,
#    /plexus-end, … из skills/ внутри пакета. Реестр скиллов и инструмент
#    загрузки уже стоят в dsh-base (строки `skill` и `tool-skill`) — свои
#    строки не нужны: повтор регистрации ломает загрузку профиля.
# 2. preset-plexus-<работник> — работники Плексуса пресетами DSH; бриф —
#    тело agents/<работник>.md, описание — его фронтматтер.
#
# Пресеты строятся на составе базового пресета DSH (dsh-skill-filesystem в
# каждом), плюс досье, инструкции, часы, инструменты работы с файлами и bash.
# Строка пресета модель не пинит: модель выбирается при создании сессии.
# Строка `agent-preset-registry` (сервис `agentPresets`) приходит из продуктового
# бандла (dsh-web-app): без неё пресеты ждут сервис и не появляются в списке.
# Поля `name` и `description` пресета проверены по `entryListProblem`: лишние
# поля схема пресета отвергает, и строка не активируется.
- insert:
    - id: plexus-skills
      name: '@plexus-dsh/plexus'
      config:
        prefix: plexus-
{{пресеты}}
